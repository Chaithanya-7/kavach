# Adaptive Endpoint Framework configuration.
# Relative paths resolve against the workspace root (parent of configs/).
# Set lab.authorized: true ONLY inside an isolated, authorized Windows test VM.
seed: 42
paths:
  experiments_dir: experiments
  outputs_dir: outputs
  database: experiments/framework.db
logging:
  level: INFO
  file: outputs/logs/framework.jsonl
lab:
  authorized: false
  name: unnamed-lab
  allowed_hostnames: []
